<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- no-referrer решает проблему блокировки 403 Forbidden со сторонних хранилищ и Википедии -->
  <meta name="referrer" content="no-referrer" />
  <title>Геймерский уголок</title>
  <!-- Пиксельный геймпад -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' shape-rendering='crispEdges'%3E%3Cpath fill='%230b0f19' d='M0 0h24v24H0z'/%3E%3Cpath fill='%23a855f7' d='M6 6h12v2H6zm-2 2h16v2H4zm-2 2h20v6H2zm0 6h4v4H2zm16 0h4v4h-4z'/%3E%3Cpath fill='%2338bdf8' d='M6 11h2v2H6zm-1 1h4v1H5zm12-1h2v2h-2zm-1 1h4v1h-4z'/%3E%3Cpath fill='%2322c55e' d='M10 13h4v1h-4z'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-dark: #0a0d16;
      --card-bg: rgba(18, 25, 41, 0.88);
      --card-border: rgba(56, 189, 248, 0.18);
      --card-border-hover: rgba(168, 85, 247, 0.6);
      --accent-purple: #a855f7;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 14% 18%, rgba(168, 85, 247, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 86% 22%, rgba(56, 189, 248, 0.20) 0%, transparent 45%),
        radial-gradient(circle at 50% 82%, rgba(244, 63, 94, 0.15) 0%, transparent 52%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    /* Шапка сайта */
    header {
      background: rgba(12, 17, 28, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
    }
    .header-content {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
      text-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
    }
    .brand svg { width: 32px; height: 32px; image-rendering: pixelated; filter: drop-shadow(0 0 8px rgba(56,189,248,0.6)); }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      user-select: none;
    }
    .btn-advisor {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      color: #fff;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-advisor:hover, .btn-advisor:active {
      box-shadow: 0 0 16px rgba(236, 72, 153, 0.7);
      transform: translateY(-2px);
    }
    .btn-primary { background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #fff; }
    .btn-primary:hover, .btn-primary:active { box-shadow: 0 0 16px rgba(139, 92, 246, 0.6); transform: translateY(-2px); }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
      border-color: rgba(148, 163, 184, 0.25);
    }
    .btn-secondary:hover { background: rgba(51, 65, 85, 0.95); border-color: var(--accent-cyan); }
    .btn-danger { background: #ef4444; color: #fff; }

    .container { max-width: 1240px; margin: 16px auto; padding: 0 14px; }

    /* Панель фильтров (оптимизирована под свайп на телефоне) */
    .controls-wrapper {
      background: rgba(18, 25, 41, 0.8);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .scroll-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-grow: 1;
    }
    .scroll-filters::-webkit-scrollbar { display: none; }
    .filter-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      align-self: center;
      flex-shrink: 0;
      margin-right: 4px;
    }
    .filter-btn {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: #fff; border-color: rgba(56, 189, 248, 0.4); }
    .filter-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #031326;
      font-weight: 700;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .filter-btn-platform.active {
      background: linear-gradient(135deg, #a855f7, #c084fc);
      color: #1a052b;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .search-input {
      background: rgba(11, 16, 28, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 9px;
      width: 240px;
      outline: none;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* Сетка игр (2 колонки на телефоне, 3-4 на ПК) */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 14px 30px rgba(0,0,0,0.65), 0 0 16px rgba(168, 85, 247, 0.3);
    }
    .card-cover-wrap {
      position: relative;
      width: 100%;
      height: 290px;
      background: #090d16;
      overflow: hidden;
    }
    .card-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .game-card:hover .card-cover { transform: scale(1.04); }

    .card-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 2;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status-playing { background: rgba(16, 185, 129, 0.92); color: #fff; }
    .status-planned { background: rgba(245, 158, 11, 0.92); color: #fff; }
    .status-paused { background: rgba(244, 63, 94, 0.92); color: #fff; }
    .status-completed { background: rgba(59, 130, 246, 0.92); color: #fff; }

    .rating-badge {
      background: rgba(15, 23, 42, 0.92);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.4);
      font-weight: 800;
    }
    .platform-badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #d8b4fe;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .card-body {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .checklist-progress { margin-top: 4px; }
    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .progress-bar-bg {
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.3s ease;
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 200;
      backdrop-filter: blur(8px);
    }
    .modal-content {
      background: #111827;
      border: 1px solid #1f2d47;
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 92vh;
      overflow-y: auto;
      padding: 22px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(56, 189, 248, 0.15);
    }
    .modal-close {
      position: absolute;
      top: 14px; right: 14px;
      background: #1f293d;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .modal-close:hover { background: #ef4444; }

    .modal-game-header { display: flex; gap: 18px; margin-bottom: 18px; }
    .modal-cover {
      width: 150px;
      height: 220px;
      border-radius: 10px;
      object-fit: cover;
      background: #0c111a;
      flex-shrink: 0;
      border: 1px solid #24324a;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .form-control {
      width: 100%;
      background: #090e17;
      border: 1px solid #222f44;
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      outline: none;
      font-size: 0.92rem;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--accent-cyan); }
    textarea.form-control { resize: vertical; min-height: 80px; }

    /* Блок поиска и загрузки обложки */
    .cover-actions-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .cover-preview-box {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }
    .cover-thumb-preview {
      width: 55px;
      height: 75px;
      object-fit: cover;
      border-radius: 6px;
      background: #090e17;
      border: 1px solid #222f44;
    }

    /* Список кандидатов обложек */
    .search-candidates-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 8px;
      padding-bottom: 6px;
    }
    .candidate-card {
      width: 80px;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid #222f44;
      border-radius: 6px;
      overflow: hidden;
      background: #090e17;
      text-align: center;
      transition: 0.2s;
    }
    .candidate-card:hover { border-color: var(--accent-cyan); transform: scale(1.05); }
    .candidate-img { width: 100%; height: 95px; object-fit: cover; display: block; }
    .candidate-title { font-size: 0.68rem; padding: 3px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Чеклист */
    .checklist-box {
      background: #0a0f1a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
    }
    .checklist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: rgba(18, 25, 41, 0.6);
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .checklist-item.done span {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .checklist-item input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--accent-green); cursor: pointer;
    }
    .checklist-del-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.7;
    }

    .notes-box {
      background: #0a0f1a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
    }
    .notes-box h4 { font-size: 0.92rem; color: #38bdf8; margin-bottom: 8px; }

    /* Окно Игрового Советника */
    .advisor-filter-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      background: #0c121e;
      border: 1px solid #1f2c42;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .advisor-result-card {
      background: #0e1524;
      border: 1px solid #243550;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .advisor-cover {
      width: 150px;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      background: #090e17;
      border: 1px solid #2a3d5e;
      flex-shrink: 0;
    }
    .advisor-details { flex-grow: 1; display: flex; flex-direction: column; gap: 7px; }
    .advisor-title { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .advisor-badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .advisor-hook {
      background: rgba(168, 85, 247, 0.12);
      border-left: 3px solid var(--accent-purple);
      padding: 7px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.4;
    }

    /* Адаптив для смартфонов */
    @media (max-width: 650px) {
      body { padding-bottom: 80px; }
      header { padding: 10px 12px; }
      .brand { font-size: 1.15rem; }
      .header-actions { width: 100%; justify-content: space-between; }
      .btn { padding: 7px 11px; font-size: 0.82rem; }
      .container { padding: 0 10px; margin-top: 10px; }

      .controls-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .search-input { width: 100%; }

      /* На смартфонах сетка из 2 аккуратных колонок */
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .card-cover-wrap { height: 180px; }
      .card-body { padding: 8px; }
      .card-title { font-size: 0.88rem; }
      .badge { font-size: 0.65rem; padding: 2px 6px; }

      .modal-content { padding: 16px; border-radius: 14px; max-height: 95vh; }
      .modal-game-header { flex-direction: column; align-items: center; text-align: center; }
      .modal-cover { width: 140px; height: 190px; }

      .advisor-result-card { flex-direction: column; align-items: center; text-align: center; }
      .advisor-cover { width: 140px; height: 190px; }
      .advisor-badge-row { justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand">
        <!-- Пиксельный геймпад -->
        <svg viewBox="0 0 24 24" shape-rendering="crispEdges">
          <path fill="#a855f7" d="M6 6h12v2H6zm-2 2h16v2H4zm-2 2h20v6H2zm0 6h4v4H2zm16 0h4v4h-4z"/>
          <path fill="#38bdf8" d="M6 11h2v2H6zm-1 1h4v1H5zm12-1h2v2h-2zm-1 1h4v1h-4z"/>
          <path fill="#22c55e" d="M10 13h4v1h-4z"/>
        </svg>
        <span>Геймерский уголок</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-advisor" onclick="openAdvisorModal()" title="Случайный хит под настроение и жанр">🎯 Подбор игры</button>
        <button class="btn btn-primary" onclick="openAddModal()">➕ Игра</button>
        <button class="btn btn-secondary" title="Резервная копия базы" onclick="exportData()">💾</button>
        <button class="btn btn-secondary" title="Загрузить резервную копию" onclick="document.getElementById('importFile').click()">📥</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)" />
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls-wrapper">
      <!-- Поиск и фильтр по статусам -->
      <div class="controls-row">
        <div class="scroll-filters">
          <span class="filter-label">Статус:</span>
          <button class="filter-btn active" onclick="setStatusFilter('all', this)">Все (<span id="count-all">0</span>)</button>
          <button class="filter-btn" onclick="setStatusFilter('playing', this)">🎮 Играю (<span id="count-playing">0</span>)</button>
          <button class="filter-btn" onclick="setStatusFilter('planned', this)">⏳ Буду играть (<span id="count-planned">0</span>)</button>
          <button class="filter-btn" onclick="setStatusFilter('paused', this)">⏸️ На паузе (<span id="count-paused">0</span>)</button>
          <button class="filter-btn" onclick="setStatusFilter('completed', this)">✅ Пройдено (<span id="count-completed">0</span>)</button>
        </div>
        <input type="text" class="search-input" id="searchBox" placeholder="🔍 Найти игру..." oninput="renderGames()" />
      </div>

      <!-- Свайп-фильтр по платформам -->
      <div class="controls-row">
        <div class="scroll-filters">
          <span class="filter-label">Платформа:</span>
          <button class="filter-btn filter-btn-platform active" onclick="setPlatformFilter('all', this)">Все</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('PC', this)">💻 PC</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('Xbox', this)">🟢 Xbox</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('PS Vita', this)">🕹️ PS Vita</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('PlayStation', this)">🔵 PlayStation</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('Switch', this)">🔴 Switch</button>
          <button class="filter-btn filter-btn-platform" onclick="setPlatformFilter('Retro', this)">👾 Retro</button>
        </div>
      </div>
    </div>

    <!-- Сетка карточек -->
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <!-- Модальное окно создания / редактирования игры -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
      <h3 style="margin-bottom: 14px; color:#fff;" id="modalFormTitle">Добавить игру</h3>

      <div class="form-group">
        <label>Название игры (на русском или английском):</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" class="form-control" id="gameTitleInput" placeholder="Например: дайн лайт, ведьмак 3, dead space..." />
          <button class="btn btn-secondary" id="autoFetchBtn" onclick="fetchGameInfo()">🔍 Найти</button>
        </div>

    // Загрузка фото с телефона/компьютера с автоматическим сжатием через canvas
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Сжимаем картинку до оптимального размера для постера (макс 450x600), чтобы не забивать память
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          const maxDim = 600;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

          document.getElementById('gameCoverInput').value = compressedDataUrl;
          updateCoverPreview(compressedDataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Умный поиск обложки и описания
    async function fetchGameInfo() {
      const rawInput = document.getElementById('gameTitleInput').value.trim();
      if (!rawInput) return alert('Введите название игры!');

      const btn = document.getElementById('autoFetchBtn');
      btn.textContent = '...';
      btn.disabled = true;

      const candidatesArea = document.getElementById('searchCandidatesArea');
      candidatesArea.innerHTML = '';
      candidatesArea.style.display = 'none';

      // 1. Проверяем словарь сленга/транслита
      const cleanLower = rawInput.toLowerCase();
      let queryTitle = GAME_ALIASES[cleanLower] || rawInput;

      // 2. Проверяем локальную базу хитов (мгновенные постеры Steam CDN)
      const hitMatch = HITS_DATABASE.find(h => 
        h.title.toLowerCase().includes(cleanLower) || 
        cleanLower.includes(h.title.toLowerCase()) ||
        (GAME_ALIASES[cleanLower] && h.title.toLowerCase().includes(GAME_ALIASES[cleanLower].toLowerCase()))
      );

      if (hitMatch) {
        document.getElementById('gameCoverInput').value = hitMatch.cover;
        updateCoverPreview(hitMatch.cover);
        if (!document.getElementById('gameDescInput').value.trim()) {
          document.getElementById('gameDescInput').value = hitMatch.desc;
        }
        btn.textContent = '🔍 Найти';
        btn.disabled = false;
        return;
      }

      // 3. Запрос в Википедию (Action API с генератором поиска и получением постеров)
      try {
        let foundCovers = [];

        // Поиск в русской Википедии
        const ruRes = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(queryTitle + ' игра')}&gsrlimit=3&prop=pageimages|extracts&exintro=1&explaintext=1&pithumbsize=600&format=json&origin=*`);
        const ruData = await ruRes.json();
        const ruPages = ruData?.query?.pages ? Object.values(ruData.query.pages) : [];

        ruPages.forEach(p => {
          if (p.thumbnail && p.thumbnail.source) {
            foundCovers.push({ title: p.title, cover: p.thumbnail.source, desc: p.extract || '' });
          }
        });

        // Если обложек мало, запрашиваем в англоязычной Википедии (оригинальные арты)
        if (foundCovers.length === 0) {
          const enRes = await fetch(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(queryTitle + ' video game')}&gsrlimit=3&prop=pageimages|extracts&exintro=1&explaintext=1&pithumbsize=600&format=json&origin=*`);
          const enData = await enRes.json();
          const enPages = enData?.query?.pages ? Object.values(enData.query.pages) : [];

          enPages.forEach(p => {
            if (p.thumbnail && p.thumbnail.source) {
              foundCovers.push({ title: p.title, cover: p.thumbnail.source, desc: p.extract || '' });
            }
          });
        }

        if (foundCovers.length > 0) {
          // Берем первый результат по умолчанию
          document.getElementById('gameCoverInput').value = foundCovers[0].cover;
          updateCoverPreview(foundCovers[0].cover);
          if (foundCovers[0].desc && !document.getElementById('gameDescInput').value.trim()) {
            document.getElementById('gameDescInput').value = foundCovers[0].desc;
          }

          // Если найдено несколько вариантов — показываем мини-галерею
          if (foundCovers.length > 1) {
            candidatesArea.style.display = 'flex';
            foundCovers.forEach(c => {
              const card = document.createElement('div');
              card.className = 'candidate-card';
              card.innerHTML = `
                <img class="candidate-img" referrerpolicy="no-referrer" src="${c.cover}" alt="вар" />
                <div class="candidate-title">${c.title}</div>
              `;
              card.onclick = () => {
                document.getElementById('gameCoverInput').value = c.cover;
                updateCoverPreview(c.cover);
                if (c.desc) document.getElementById('gameDescInput').value = c.desc;
              };
              candidatesArea.appendChild(card);
            });
          }
        } else {
          alert('Обложка не найдена. Нажмите кнопку «📁 Фото», чтобы выбрать любую картинку или скриншот прямо с телефона!');
        }
      } catch (err) {
        console.error(err);
        alert('Не удалось связаться с базой. Нажмите «📁 Фото», чтобы прикрепить картинку из памяти устройства.');
      } finally {
        btn.textContent = '🔍 Найти';
        btn.disabled = false;
      }
    }

                <span>${pct}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }

        const ratingBadgeHtml = game.rating ? `<span class="badge rating-badge">⭐ ${game.rating}</span>` : '';

        card.innerHTML = `
          <div class="card-cover-wrap">
            <div class="card-badges">
              <span class="badge ${statusClasses[game.status]}">${statusLabels[game.status]}</span>
              ${ratingBadgeHtml}
            </div>
            <img class="card-cover" referrerpolicy="no-referrer" src="${game.cover || DEFAULT_COVER_SVG}" alt="${game.title}" onerror="handleCoverError(this)" />
          </div>
          <div class="card-body">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <span class="badge platform-badge">${game.platform}</span>
                ${game.completedDate ? `<span style="font-size:0.7rem; color:#94a3b8;">🏁 ${game.completedDate.slice(0,7)}</span>` : ''}
              </div>
              <div class="card-title">${game.title}</div>
            </div>
            ${progressHtml}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setStatusFilter(status, el) {
      currentStatusFilter = status;
      document.querySelectorAll('.filter-btn:not(.filter-btn-platform)').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderGames();
    }

    function setPlatformFilter(platform, el) {
      currentPlatformFilter = platform;
      document.querySelectorAll('.filter-btn-platform').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderGames();
    }

    /* --- ЛОГИКА ИГРОВОГО СОВЕТНИКА БЕЗ ПОВТОРОВ --- */
    function openAdvisorModal() {
      resetAdvisorAndRoll();
      document.getElementById('advisorModal').style.display = 'flex';
    }

    function resetAdvisorAndRoll() {
      const source = document.getElementById('advisorSourceSelect').value;
      const mood = document.getElementById('advisorMoodSelect').value;
      const genre = document.getElementById('advisorGenreSelect').value;

      let baseList = (source === 'my') ? [...games] : [...HITS_DATABASE];

      if (source !== 'my') {
        if (mood !== 'all') {
          baseList = baseList.filter(h => h.mood === mood);
        }
        if (genre !== 'all') {
          baseList = baseList.filter(h => h.genreCategory === genre);
        }
      }

      // Перемешиваем список (тасование Фишера-Йетса)
      for (let i = baseList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [baseList[i], baseList[j]] = [baseList[j], baseList[i]];
      }

      advisorPool = baseList;
      advisorHistory = [];
      rollAdvisor();
    }

    function rollAdvisor() {
      if (!advisorPool || advisorPool.length === 0) {
        document.getElementById('advisorCard').style.display = 'none';
        document.getElementById('advAddBtn').style.display = 'none';
        alert('По выбранным фильтрам ничего не найдено! Смените настроение или жанр.');
        return;
      }

      document.getElementById('advisorCard').style.display = 'flex';
      document.getElementById('advAddBtn').style.display = 'inline-flex';

      // Если все игры из текущего пула уже были показаны — сбрасываем историю для нового круга
      if (advisorHistory.length >= advisorPool.length) {
        advisorHistory = [];
      }

      // Находим игру, которая еще не показывалась в текущем цикле
      let available = advisorPool.filter(g => !advisorHistory.includes(g.title));
      if (available.length === 0) available = advisorPool;

      const chosen = available[0];
      advisorHistory.push(chosen.title);
      currentAdvisorHit = chosen;

      document.getElementById('advTitle').textContent = chosen.title;
      document.getElementById('advCover').src = chosen.cover || DEFAULT_COVER_SVG;
      document.getElementById('advPlatform').textContent = chosen.platform || 'PC';
      document.getElementById('advGenre').textContent = chosen.genreName || (chosen.genreCategory ? chosen.genreCategory.toUpperCase() : 'Хит');
      document.getElementById('advRating').textContent = chosen.rating ? `⭐ ${chosen.rating}/10` : '⭐ 9/10';
      document.getElementById('advHook').textContent = chosen.hook || '✨ Отличная игра для яркого вечера!';
      document.getElementById('advDesc').textContent = chosen.desc || chosen.description || 'Классика, в которую стоит сыграть.';

      const exists = games.some(g => g.title.toLowerCase() === chosen.title.toLowerCase());
      const addBtn = document.getElementById('advAddBtn');
      if (exists) {
        addBtn.textContent = '✅ Уже в вашем списке';
        addBtn.disabled = true;
      } else {
        addBtn.textContent = '➕ В мой список («Буду играть»)';
        addBtn.disabled = false;
      }
    }

    function addAdvisorGameToCollection() {
      if (!currentAdvisorHit) return;
      const newGame = {
        id: Date.now().toString(),
        title: currentAdvisorHit.title,
        status: 'planned',
        platform: currentAdvisorHit.platform ? currentAdvisorHit.platform.split(' / ')[0] : 'PC',
        rating: currentAdvisorHit.rating || '',
        completedDate: '',
        cover: currentAdvisorHit.cover || '',
        description: currentAdvisorHit.desc || currentAdvisorHit.description || '',
        notes: currentAdvisorHit.hook ? `Рекомендация: ${currentAdvisorHit.hook}` : '',
        checklist: []
      };

      games.unshift(newGame);
      localStorage.setItem('gamers_corner_data', JSON.stringify(games));
      renderGames();

      const addBtn = document.getElementById('advAddBtn');
      addBtn.textContent = '✅ Добавлено!';
      addBtn.disabled = true;
    }

    /* --- РЕДАКТИРОВАНИЕ И МОДАЛЬНЫЕ ОКНА --- */
    function renderEditChecklist() {
      const container = document.getElementById('editChecklistContainer');
      container.innerHTML = '';
      tempChecklist.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `checklist-item ${item.done ? 'done' : ''}`;
        div.innerHTML = `
          <input type="checkbox" ${item.done ? 'checked' : ''} onchange="tempChecklist[${index}].done = this.checked; renderEditChecklist();" />
          <span style="flex-grow:1; font-size:0.88rem;">${item.text}</span>
          <button type="button" class="checklist-del-btn" onclick="tempChecklist.splice(${index}, 1); renderEditChecklist();">&times;</button>
        `;
        container.appendChild(div);
      });
    }

    function addChecklistItem() {
      const input = document.getElementById('newChecklistInput');
      const text = input.value.trim();
      if (!text) return;
      tempChecklist.push({ id: Date.now().toString(), text: text, done: false });
      input.value = '';
      renderEditChecklist();
    }

    function openAddModal() {
      editingId = null;
      tempChecklist = [];
      document.getElementById('modalFormTitle').textContent = 'Добавить игру';
      document.getElementById('gameTitleInput').value = '';
      document.getElementById('gameStatusSelect').value = 'playing';
      document.getElementById('gamePlatformSelect').value = 'PC';
      document.getElementById('gameRatingSelect').value = '';
      document.getElementById('gameCompletedDateInput').value = '';
      document.getElementById('gameCoverInput').value = '';
      document.getElementById('searchCandidatesArea').innerHTML = '';
      document.getElementById('searchCandidatesArea').style.display = 'none';
      updateCoverPreview('');
      document.getElementById('gameDescInput').value = '';
      document.getElementById('gameNotesInput').value = '';
      document.getElementById('deleteBtn').style.display = 'none';
      renderEditChecklist();
      document.getElementById('editModal').style.display = 'flex';
    }

    function openEditModal(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;
      editingId = id;
      closeModal('viewModal');
      tempChecklist = JSON.parse(JSON.stringify(game.checklist || []));

      document.getElementById('modalFormTitle').textContent = 'Редактировать игру';
      document.getElementById('gameTitleInput').value = game.title;
      document.getElementById('gameStatusSelect').value = game.status;
      document.getElementById('gamePlatformSelect').value = game.platform || 'PC';
      document.getElementById('gameRatingSelect').value = game.rating || '';
      document.getElementById('gameCompletedDateInput').value = game.completedDate || '';
      document.getElementById('gameCoverInput').value = game.cover;
      document.getElementById('searchCandidatesArea').innerHTML = '';
      document.getElementById('searchCandidatesArea').style.display = 'none';
      updateCoverPreview(game.cover);
      document.getElementById('gameDescInput').value = game.description;
      document.getElementById('gameNotesInput').value = game.notes || '';
      document.getElementById('deleteBtn').style.display = 'block';

      renderEditChecklist();
      document.getElementById('editModal').style.display = 'flex';
    }

    function openViewModal(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      document.getElementById('viewTitle').textContent = game.title;
      document.getElementById('viewDesc').textContent = game.description || 'Описание отсутствует.';
      document.getElementById('viewNotes').textContent = game.notes || 'Заметок пока нет. Нажмите «Редактировать», чтобы записать тайники или секреты!';
      document.getElementById('viewCover').src = game.cover || DEFAULT_COVER_SVG;

      const badge = document.getElementById('viewBadge');
      badge.textContent = statusLabels[game.status];
      badge.className = `badge ${statusClasses[game.status]}`;

      document.getElementById('viewPlatformBadge').textContent = game.platform || 'PC';

      const ratingBadge = document.getElementById('viewRatingBadge');
      if (game.rating) {
        ratingBadge.textContent = `⭐ ${game.rating} / 10`;
        ratingBadge.style.display = 'inline-flex';
      } else {
        ratingBadge.style.display = 'none';
      }

      const dateBadge = document.getElementById('viewDateBadge');
      if (game.completedDate) {
        dateBadge.textContent = `🏁 Финал: ${game.completedDate}`;
        dateBadge.style.display = 'inline-flex';
      } else {
        dateBadge.style.display = 'none';
      }

      const checklistBox = document.getElementById('viewChecklistBox');
      const itemsContainer = document.getElementById('viewChecklistItems');
      itemsContainer.innerHTML = '';

      if (game.checklist && game.checklist.length > 0) {
        checklistBox.style.display = 'block';
        const doneCount = game.checklist.filter(i => i.done).length;
        document.getElementById('viewChecklistRatio').textContent = `${doneCount} из ${game.checklist.length} выполнено`;

        game.checklist.forEach(item => {
          const div = document.createElement('div');
          div.className = `checklist-item ${item.done ? 'done' : ''}`;
          div.innerHTML = `
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklistView('${game.id}', '${item.id}', this.checked)" />
            <span style="flex-grow:1; font-size:0.9rem;">${item.text}</span>
          `;
          itemsContainer.appendChild(div);
        });
      } else {
        checklistBox.style.display = 'none';
      }

      document.getElementById('editFromViewBtn').onclick = () => openEditModal(game.id);
      document.getElementById('viewModal').style.display = 'flex';
    }

    function toggleChecklistView(gameId, itemId, isChecked) {
      const game = games.find(g => g.id === gameId);
      if (!game) return;
      const item = game.checklist.find(i => i.id === itemId);
      if (item) {
        item.done = isChecked;
        localStorage.setItem('gamers_corner_data', JSON.stringify(games));
        openViewModal(gameId);
        renderGames();
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function saveGame() {
      const title = document.getElementById('gameTitleInput').value.trim();
      if (!title) return alert('Введите название игры!');

      const gameData = {
        title: title,
        status: document.getElementById('gameStatusSelect').value,
        platform: document.getElementById('gamePlatformSelect').value,
        rating: document.getElementById('gameRatingSelect').value,
        completedDate: document.getElementById('gameCompletedDateInput').value,
        cover: document.getElementById('gameCoverInput').value.trim(),
        description: document.getElementById('gameDescInput').value.trim(),
        notes: document.getElementById('gameNotesInput').value.trim(),
        checklist: tempChecklist
      };

      if (editingId) {
        const index = games.findIndex(g => g.id === editingId);
        if (index !== -1) {
          games[index] = { ...games[index], ...gameData };
        }
      } else {
        gameData.id = Date.now().toString();
        games.unshift(gameData);
      }

      localStorage.setItem('gamers_corner_data', JSON.stringify(games));
      closeModal('editModal');
      renderGames();
    }

    function deleteCurrentGame() {
      if (!editingId) return;
      if (confirm('Точно удалить эту игру из списка?')) {
        games = games.filter(g => g.id !== editingId);
        localStorage.setItem('gamers_corner_data', JSON.stringify(games));
        closeModal('editModal');
        renderGames();
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(games, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `gamers_corner_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            games = imported;
            games.forEach(g => {
              if (!g.platform) g.platform = 'PC';
              if (!g.checklist) g.checklist = [];
            });
            localStorage.setItem('gamers_corner_data', JSON.stringify(games));
            renderGames();
            alert('База игр успешно восстановлена!');
          }
        } catch (err) {
          alert('Ошибка при чтении файла резервной копии.');
        }
      };
      reader.readAsText(file);
    }

    window.onclick = (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.style.display = 'none';
      }
    };

    renderGames();
  </script>
</body>
</html>
